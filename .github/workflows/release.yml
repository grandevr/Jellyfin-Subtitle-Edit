name: Release

# Run by hand from the Actions tab after the version bump is merged. Builds the version in Directory.Build.props,
# publishes it as a GitHub release with the plugin zip, and adds it to manifest.json (the Jellyfin repository).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Read version
        id: info
        run: python3 .github/scripts/release.py info >> "$GITHUB_OUTPUT"

      - name: Refuse a version that is already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump <Version> in Directory.Build.props first."
            exit 1
          fi
          python3 .github/scripts/release.py notes > "$RUNNER_TEMP/notes.md"

      - name: Build and test
        run: |
          dotnet build SubtitleQuickEdit.slnx -c Release
          dotnet test SubtitleQuickEdit.slnx -c Release --no-build
          node --test src/Jellyfin.Plugin.SubtitleQuickEdit/Client/test/*.test.js

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          zip="subtitle-editor_${VERSION}.zip"
          md5=$(python3 .github/scripts/release.py package src/Jellyfin.Plugin.SubtitleQuickEdit/bin/Release/net10.0 "$RUNNER_TEMP/$zip")
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "md5=$md5" >> "$GITHUB_OUTPUT"
          unzip -l "$RUNNER_TEMP/$zip"
          echo "MD5 $md5"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: gh release create "$TAG" "$RUNNER_TEMP/$ZIP" --target "$(git rev-parse HEAD)" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Add the version to manifest.json
        env:
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          MD5: ${{ steps.package.outputs.md5 }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          python3 .github/scripts/release.py manifest "$url" "$MD5" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: add $VERSION"
          git push origin HEAD:main

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['manifest.json', '**.md']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build
        run: dotnet build SubtitleQuickEdit.slnx -c Release
      - name: Unit tests
        run: dotnet test SubtitleQuickEdit.slnx -c Release --no-build
      - name: Client tests
        run: node --test src/Jellyfin.Plugin.SubtitleQuickEdit/Client/test/*.test.js
